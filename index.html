<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a855f7">
<title>כפל-כיף – משחק לוח הכפל</title>
<meta name="description" content="משחק לתרגול לוח הכפל וחשבון לכיתות ג׳-ד׳: פותרים תרגילים, מרוויחים מטבעות זהב ומלבישים את הדמות!">
<meta property="og:title" content="כפל-כיף 🪙 משחק לוח הכפל">
<meta property="og:description" content="פותרים תרגילים, מרוויחים מטבעות ומלבישים את הדמות!">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fdf2ff; --bg2:#e0f2fe; --ink:#2e1065; --muted:#6b5b95; --card:#ffffff;
  --pri:#7c3aed; --pri2:#a855f7; --pink:#ec4899; --gold:#f5b301; --gold2:#fde68a;
  --good:#16a34a; --bad:#e11d48; --line:#eadcff; --orange:#f97316;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Rubik','Varela Round',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,var(--bg1) 0%,#f5f3ff 45%,var(--bg2) 100%) fixed;
  -webkit-user-select:none;user-select:none;
}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:12px 16px 28px}
.screen{display:none;flex-direction:column;gap:12px;animation:fadein .25s ease}
.screen.active{display:flex}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.brand{font-weight:800;font-size:1.5rem;background:linear-gradient(90deg,var(--pri),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.coins{display:inline-flex;align-items:center;gap:6px;padding:6px 14px 6px 12px;border-radius:999px;
  background:linear-gradient(180deg,#fff7d1,var(--gold2));border:2px solid var(--gold);font-weight:800;font-size:1.15rem;color:#7a4b00;box-shadow:0 2px 0 #d39a00}
.coins .ic{font-size:1.2rem}
.coins.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.18)}}
.back{border:none;background:#fff;border-radius:14px;padding:8px 14px;font-weight:600;font-size:1rem;box-shadow:0 2px 0 var(--line)}

/* ---------- buttons ---------- */
.btn{border:none;border-radius:20px;padding:14px 18px;font-size:1.1rem;font-weight:800;background:#fff;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.big{font-size:1.25rem;padding:18px}
.btn.primary{background:linear-gradient(180deg,#a78bfa,var(--pri));color:#fff;box-shadow:0 4px 0 #5b21b6}
.btn.pink{background:linear-gradient(180deg,#f9a8d4,var(--pink));color:#fff;box-shadow:0 4px 0 #be185d}
.btn.gold{background:linear-gradient(180deg,#fde68a,var(--gold));color:#5b3a00;box-shadow:0 4px 0 #b98200}
.btn.green{background:linear-gradient(180deg,#86efac,#22c55e);color:#053b17;box-shadow:0 4px 0 #15803d}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* ---------- stage / avatar ---------- */
#homeStage{width:min(100%,46vh);margin:0 auto}
.stage{position:relative;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 8px 24px rgba(124,58,237,.18);border:4px solid #fff}
.stage svg{display:block;width:100%;height:auto}
.live svg{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scale(1.012) translateY(-1px)}}
.live .eyes{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.nametag{position:absolute;bottom:10px;right:50%;transform:translateX(50%);background:rgba(255,255,255,.92);padding:4px 16px;border-radius:999px;font-weight:800;font-size:1.1rem;box-shadow:0 2px 6px rgba(0,0,0,.1);white-space:nowrap}
.bubble{position:relative;background:#fff;border-radius:18px;padding:12px 16px;font-weight:600;line-height:1.4;box-shadow:0 3px 0 var(--line);text-align:center}
.bubble:before{content:"";position:absolute;top:-10px;right:50%;transform:translateX(50%);border:10px solid transparent;border-top:0;border-bottom-color:#fff}

/* ---------- pick screen ---------- */
.title{text-align:center;margin:6px 0 0}
.title h1{margin:0;font-size:2.4rem;font-weight:800;background:linear-gradient(90deg,var(--pri),var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.title p{margin:4px 0 0;color:var(--muted);font-weight:600}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.preset{border:4px solid transparent;border-radius:20px;background:#fff;padding:0;overflow:hidden;box-shadow:0 3px 0 var(--line)}
.preset svg{display:block;width:100%;height:auto}
.preset span{display:block;padding:4px 0 6px;font-weight:800}
.preset.on{border-color:var(--pri);transform:scale(1.03)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600}
.field input{font:inherit;font-size:1.2rem;padding:12px 14px;border-radius:16px;border:3px solid var(--line);outline:none;text-align:center;background:#fff}
.field input:focus{border-color:var(--pri2)}

/* ---------- topics ---------- */
.seg{display:flex;background:#fff;border-radius:16px;padding:4px;box-shadow:0 2px 0 var(--line)}
.seg button{flex:1;border:none;background:transparent;padding:10px;border-radius:12px;font-weight:800;font-size:1.05rem;color:var(--muted)}
.seg button.on{background:linear-gradient(180deg,#a78bfa,var(--pri));color:#fff}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.topic{border:none;border-radius:22px;background:#fff;padding:14px 10px 12px;text-align:center;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:132px;justify-content:center}
.topic:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.topic .ti{font-size:2.1rem;line-height:1}
.topic .tn{font-weight:800;font-size:1.08rem}
.topic .tc{font-size:.85rem;color:#8a5a00;background:#fff4c2;border-radius:999px;padding:2px 10px;font-weight:600}
.topic .ts{font-size:.78rem;color:var(--muted)}
.topic.wide{grid-column:1 / -1;flex-direction:row;min-height:auto;gap:12px;justify-content:center}
.topic.special{background:linear-gradient(135deg,#fff7d1,#ffe4f1)}
.section-h{margin:4px 2px 0;font-size:1rem;color:var(--muted)}

/* ---------- quiz ---------- */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;color:var(--muted)}
.streak{font-weight:800;color:var(--orange)}
.qcard{background:#fff;border-radius:26px;padding:22px 16px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;box-shadow:0 6px 0 var(--line);text-align:center;position:relative}
.qcard.good{box-shadow:0 6px 0 #86efac;background:#f0fdf4}
.qcard.badc{animation:shake .4s}
.qlabel{font-size:.9rem;color:var(--muted);font-weight:600}
.ex{display:inline-block;font-size:2.6rem;font-weight:800;letter-spacing:.5px;white-space:nowrap;font-variant-numeric:tabular-nums;unicode-bidi:isolate}
.ex.long{font-size:2rem}.ex.xlong{font-size:1.6rem}
.qtext{font-size:1.3rem;line-height:1.6;font-weight:600}
.qtext .frac{font-size:1.1em}
.sub{font-size:1.15rem;font-weight:700;color:var(--muted)}
.slot{display:inline-block;min-width:1.4em;padding:0 .18em;border-radius:14px;background:#f3e8ff;color:var(--pri);border:3px dashed #c4b5fd;line-height:1.15;vertical-align:middle;transition:background .2s}
.slot:empty:before{content:"?";opacity:.45}
.slot.good{background:#dcfce7;border-color:#22c55e;border-style:solid;color:var(--good);animation:pop .35s}
.slot.reveal{background:#ffedd5;border-color:var(--orange);border-style:solid;color:#c2410c}
.slot.bad{animation:shake .4s;border-color:var(--bad);color:var(--bad)}
.ansbox{font-size:2.4rem;font-weight:800}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pop{50%{transform:scale(1.25)}}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.85em;margin:0 .1em}
.frac>span:first-child{border-bottom:.09em solid currentColor;padding:0 .15em .04em}
.frac>span:last-child{padding-top:.04em}
.frac .slot{font-size:.9em}
.pie{width:130px;height:130px}
.feedback{min-height:30px;text-align:center;font-weight:800;font-size:1.15rem}
.feedback.good{color:var(--good)}
.feedback.bad{color:var(--bad)}
.feedback .tip{display:block;font-size:.95rem;font-weight:600;color:var(--muted);margin-top:4px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;direction:ltr}
.key{border:none;border-radius:18px;background:#fff;font-size:1.8rem;font-weight:800;height:62px;box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key.ok{background:linear-gradient(180deg,#86efac,#22c55e);color:#053b17;box-shadow:0 4px 0 #15803d}
.key.del{background:#ffe4e6;color:#9f1239;font-size:1.5rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.three{grid-template-columns:repeat(3,1fr);direction:ltr}
.choice{border:3px solid transparent;border-radius:20px;background:#fff;font-size:1.8rem;font-weight:800;min-height:80px;padding:8px;box-shadow:0 4px 0 var(--line)}
.choice.txt{font-size:1.3rem}
.choice.good{background:#dcfce7;border-color:#22c55e;animation:pop .35s}
.choice.bad{background:#ffe4e6;border-color:var(--bad);opacity:.7}
.choice.reveal{background:#ffedd5;border-color:var(--orange)}
.timer{height:14px;border-radius:999px;background:#fff;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.timer>div{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#facc15,#f97316);transition:width .1s linear}
.float{position:fixed;z-index:60;font-weight:800;font-size:1.5rem;color:#b77900;pointer-events:none;animation:floatup 1.1s ease-out forwards;text-shadow:0 2px 0 #fff}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}

/* ---------- shop ---------- */
.shop-top{position:sticky;top:0;z-index:5;padding-top:4px;background:linear-gradient(180deg,#fbf2ff 85%,rgba(251,242,255,0));display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.shop-stage{width:min(46vw,200px,25vh);margin:0 auto}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:none;border-radius:999px;background:#fff;padding:8px 14px;font-weight:800;font-size:1rem;box-shadow:0 2px 0 var(--line)}
.tab.on{background:linear-gradient(180deg,#f9a8d4,var(--pink));color:#fff}
.cat-h{margin:10px 2px 6px;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}
.tile{position:relative;border:3px solid transparent;border-radius:18px;background:#fff;padding:6px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 3px 0 var(--line)}
.tile svg{width:100%;height:auto;border-radius:12px;display:block}
.tile .sw{width:54px;height:54px;border-radius:50%;margin:6px 0 2px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.08)}
.tile .sw.none{display:flex;align-items:center;justify-content:center;font-size:1.8rem;background:#f4f4f5}
.tile .tn{font-size:.85rem;font-weight:700}
.tile .pr{font-size:.8rem;font-weight:800;color:#8a5a00;background:#fff4c2;border-radius:999px;padding:1px 8px}
.tile .pr.own{background:#ede9fe;color:var(--pri)}
.tile.on{border-color:var(--pri);background:#faf5ff}
.tile.on .pr.own{background:var(--pri);color:#fff}
.tile.pv{border-color:var(--pink);border-style:dashed}
.tile.locked:after{content:"🔒";position:absolute;top:4px;left:6px;font-size:.9rem}
.tile.cant .pr{color:#9ca3af;background:#f4f4f5}
.pvbar[hidden]{display:none}
.pvbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-radius:22px 22px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(124,58,237,.2);display:flex;align-items:center;gap:10px;z-index:20;animation:slideup .25s}
.pvbar .info{flex:1;font-weight:700;line-height:1.3}
.pvbar .info small{display:block;color:var(--muted);font-weight:600}
.pvbar .btn{padding:12px 14px;font-size:1rem}
@keyframes slideup{from{transform:translate(-50%,100%)}}
.spacer{height:90px}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(46,16,101,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal.hidden{display:none}
.mcard{background:#fff;border-radius:26px;padding:20px 18px;width:100%;max-width:420px;max-height:88vh;overflow:auto;animation:pop .3s;display:flex;flex-direction:column;gap:12px}
.mcard h2{margin:0;text-align:center}
.mcard p{margin:0;line-height:1.5;text-align:center}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;direction:ltr}
.chip{border:3px solid var(--line);background:#fff;border-radius:14px;font-size:1.3rem;font-weight:800;height:52px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.stat{display:flex;align-items:center;gap:10px;font-weight:600}
.stat .nm{flex:0 0 42%}
.stat .bar{flex:1;height:12px;background:#f3e8ff;border-radius:999px;overflow:hidden}
.stat .bar div{height:100%;background:linear-gradient(90deg,var(--pri2),var(--pink))}
.stat .vl{flex:0 0 64px;text-align:left;font-size:.85rem;color:var(--muted);direction:ltr}
.toggle{display:flex;align-items:center;justify-content:space-between;font-weight:700}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;z-index:70;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:92vw;text-align:center;animation:toastin .3s;pointer-events:none}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-20px)}}
.cf{position:fixed;top:-14px;width:10px;height:14px;z-index:80;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.big-emoji{font-size:3.4rem;text-align:center;line-height:1}
.muted{color:var(--muted);font-size:.9rem;text-align:center}
</style>
</head>
<body>
<div id="app">

  <!-- ===== choose character ===== -->
  <section class="screen" id="sc-pick">
    <div class="title"><h1>כפל-כיף 🪙</h1><p>פותרים תרגילים ✦ מרוויחים מטבעות ✦ מלבישים את הדמות</p></div>
    <h3 class="section-h" style="text-align:center;font-size:1.2rem;color:var(--ink)">בחרו דמות:</h3>
    <div class="presets" id="presets"></div>
    <label class="field">איך קוראים לדמות?
      <input id="nameInput" maxlength="14" autocomplete="off">
    </label>
    <button class="btn big primary" id="startBtn">יאללה, מתחילים! 🚀</button>
  </section>

  <!-- ===== home ===== -->
  <section class="screen" id="sc-home">
    <div class="topbar"><div class="brand">כפל-כיף</div><div class="coins"><span class="ic">🪙</span><b class="coinNum">0</b></div></div>
    <div class="stage live" id="homeStage"></div>
    <div class="bubble" id="bubble"></div>
    <button class="btn big primary" id="goPractice">✏️ פותרים תרגילים ומרוויחים</button>
    <button class="btn big pink" id="goShop">👗 חנות ומלתחה</button>
    <div class="row">
      <button class="btn" id="goStats">📊 התקדמות</button>
      <button class="btn" id="goSettings">⚙️ הגדרות</button>
    </div>
  </section>

  <!-- ===== topics ===== -->
  <section class="screen" id="sc-topics">
    <div class="topbar"><button class="back" data-go="home">→ חזרה</button><div class="coins"><span class="ic">🪙</span><b class="coinNum">0</b></div></div>
    <div class="seg" id="gradeSeg"><button data-g="3">כיתה ג׳</button><button data-g="4">כיתה ד׳</button></div>
    <div class="topics" id="topicGrid"></div>
  </section>

  <!-- ===== quiz ===== -->
  <section class="screen" id="sc-quiz">
    <div class="topbar"><button class="back" id="quitQuiz">→ סיום</button><div class="coins"><span class="ic">🪙</span><b class="coinNum">0</b></div></div>
    <div class="qhead"><span id="qTitle"></span><span id="qScore"></span><span class="streak" id="qStreak"></span></div>
    <div class="timer" id="timer" hidden><div id="timerBar"></div></div>
    <div class="qcard" id="qcard"></div>
    <div class="feedback" id="feedback"></div>
    <div id="answerArea"></div>
  </section>

  <!-- ===== shop ===== -->
  <section class="screen" id="sc-shop">
    <div class="shop-top">
      <div class="topbar"><button class="back" id="shopBack">→ חזרה</button><div class="coins"><span class="ic">🪙</span><b class="coinNum">0</b></div></div>
      <div class="stage live shop-stage" id="shopStage"></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div id="shopBody"></div>
    <div class="spacer"></div>
  </section>
</div>

<div class="pvbar" id="pvbar" hidden></div>
<div class="modal hidden" id="modal"><div class="mcard" id="mcard"></div></div>

<script>
'use strict';
/* =========================================================
   helpers
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const P = a => a[Math.floor(Math.random() * a.length)];
const F = n => Number(n).toLocaleString('en-US');
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function starPts(cx, cy, r, ri = r * 0.45) {
  const p = [];
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? ri : r, a = -Math.PI / 2 + i * Math.PI / 5;
    p.push((cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1));
  }
  return p.join(' ');
}
const star = (cx, cy, r, fill, extra = '') => `<polygon points="${starPts(cx, cy, r)}" fill="${fill}" ${extra}/>`;
const HEART = 'M0,0.3 C0,-0.1 -0.5,-0.1 -0.5,0.3 C-0.5,0.6 -0.1,0.8 0,1 C0.1,0.8 0.5,0.6 0.5,0.3 C0.5,-0.1 0,-0.1 0,0.3 Z';
const heart = (x, y, s, fill, extra = '') => `<path d="${HEART}" transform="translate(${x},${y}) scale(${s})" fill="${fill}" ${extra}/>`;
const sparkle = (x, y, r, fill) => `<path d="M${x},${y - r} Q${x},${y} ${x + r},${y} Q${x},${y} ${x},${y + r} Q${x},${y} ${x - r},${y} Q${x},${y} ${x},${y - r} Z" fill="${fill}"/>`;
function flower(x, y, r, c) {
  let s = '';
  for (let i = 0; i < 5; i++) { const a = i * 1.2566 - 1.57; s += `<circle cx="${(x + r * Math.cos(a)).toFixed(1)}" cy="${(y + r * Math.sin(a)).toFixed(1)}" r="${r * 0.78}" fill="${c}"/>`; }
  return s + `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r * 0.6}" fill="#fde047"/>`;
}
function bez(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return [0, 1].map(i => u * u * u * p0[i] + 3 * u * u * t * p1[i] + 3 * u * t * t * p2[i] + t * t * t * p3[i]);
}

/* =========================================================

let AC = null;
function tone(f, dur = 0.12, type = 'sine', when = 0, vol = 0.13) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const SND = {

  buy() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, 'triangle', i * .08)); },

function confetti(n = 50) {
  const cols = ['#f472b6', '#a78bfa', '#facc15', '#34d399', '#60a5fa', '#fb923c'];
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div'); d.className = 'cf';
    d.style.left = Math.random() * 100 + 'vw'; d.style.background = P(cols);
    d.style.animationDuration = (1.4 + Math.random() * 1.6) + 's'; d.style.animationDelay = Math.random() * .3 + 's';
    document.body.appendChild(d); setTimeout(() => d.remove(), 3500);
  }
}
function floatText(el, text) {

  f.className = 'float'; f.textContent = text;

    $('#tGo').onclick = () => { S.tables = [...sel].sort((a, b) => a - b); save(); closeModal(); startQuiz(t); };
  };
  draw();
}

/* ---------- quiz ---------- */
let Q = null;
function startQuiz(topic) {
  if (Q && Q.timer) clearInterval(Q.timer);
  Q = { topic, speed: topic === 'speed', correct: 0, total: 0, earned: 0, streak: 0, input: '', tries: 0, locked: false, cur: null, lastHtml: '', timer: null, end: 0 };
  $('#qTitle').textContent = topic === 'mix' ? '🎲 ערבוב' : topic === 'speed' ? '⏱️ אתגר' : topicById(topic).icon + ' ' + topicById(topic).name;
  $('#timer').hidden = !Q.speed;
  show('quiz');
  if (Q.speed) {
    Q.end = Date.now() + 60000;
    $('#timerBar').style.width = '100%';
    Q.timer = setInterval(() => {
      const left = Q.end - Date.now();
      $('#timerBar').style.width = Math.max(0, left / 600) + '%';
      if (left <= 0) endSpeed();
    }, 100);
  }
  nextQ();
}
function nextQ() {
  const tid = Q.speed ? 'kefel' : Q.topic === 'mix' ? P(TOPICS).id : Q.topic;
  let q, n = 0;
  do { q = topicById(tid).gen(S.grade); n++; } while (q.html === Q.lastHtml && n < 10);
  q.tid = tid; Q.lastHtml = q.html; Q.cur = q; Q.input = ''; Q.tries = 0; Q.locked = false;
  const card = $('#qcard'); card.className = 'qcard';
  card.innerHTML = (Q.topic === 'mix' ? `<div class="qlabel">${topicById(tid).icon} ${topicById(tid).name}</div>` : '') + q.html +
    (q.kind === 'num' && !q.html.includes('class="slot"') ? `<div class="ansbox">${SLOT}</div>` : '');
  const exEl = card.querySelector('.ex');
  if (exEl) { const len = exEl.textContent.length; if (len > 19) exEl.classList.add('xlong'); else if (len > 14) exEl.classList.add('long'); }
  $('#feedback').className = 'feedback'; $('#feedback').innerHTML = '';
  if (q.kind === 'num') {
    $('#answerArea').innerHTML = `<div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button class="key" data-k="${d}">${d}</button>`).join('')}<button class="key del" data-k="del">⌫</button><button class="key" data-k="0">0</button><button class="key ok" data-k="ok">✓</button></div>`;
    $$('#answerArea .key').forEach(k => k.onclick = () => keyPress(k.dataset.k));
  } else {
    $('#answerArea').innerHTML = `<div class="choices ${q.choices.length === 3 ? 'three' : ''}">${q.choices.map((c, i) => `<button class="choice ${q.txt ? 'txt' : ''}" data-i="${i}">${c}</button>`).join('')}</div>`;
    $$('#answerArea .choice').forEach(b => b.onclick = () => pickChoice(+b.dataset.i, b));
  }
  updateHead(); drawSlot();
}
function updateHead() {
  $('#qScore').textContent = Q.total ? `✔ ${Q.correct}/${Q.total}` : '';
  $('#qStreak').textContent = Q.streak >= 2 ? `🔥 ${Q.streak}` : '';
}
function slotEl() { return $('#qcard .slot'); }
function drawSlot() { const s = slotEl(); if (s && Q.cur.kind === 'num') s.textContent = Q.input; }
function keyPress(k) {
  if (!Q || Q.locked) { if (Q && Q.waiting && k === 'ok') { Q.waiting = false; nextQ(); } return; }
  if (k === 'del') { Q.input = Q.input.slice(0, -1); SND.tap(); }
  else if (k === 'ok') return check();
  else if (Q.input.length < 6) { Q.input = (Q.input === '0' ? '' : Q.input) + k; SND.tap(); }
  drawSlot();
}
function check() {
  if (Q.input === '') { const s = slotEl(); s.classList.remove('bad'); void s.offsetWidth; s.classList.add('bad'); return; }
  if (parseInt(Q.input, 10) === Q.cur.ans) onRight(); else onWrong();
}
function pickChoice(i, btn) {
  if (Q.locked) return;
  if (i === Q.cur.correct) { btn.classList.add('good'); onRight(); return; }
  btn.classList.add('bad'); btn.disabled = true;
  const maxTries = Q.cur.choices.length <= 2 ? 1 : 2;
  onWrong(maxTries);
}
const PRAISE = ['כל הכבוד!', 'מעולה!', 'מצוין!', 'וואו!', 'בול!', 'יופי!', 'נהדר!', 'פצצה!', 'מושלם!', 'אלופים!', 'גאונות!'];
function record(tid, firstTry) {
  const s = S.stats[tid] || (S.stats[tid] = { c: 0, t: 0 });
  s.t++; if (firstTry) s.c++;
  Q.total++; if (firstTry) Q.correct++;
}
function onRight() {
  Q.locked = true;
  const first = Q.tries === 0, base = Q.speed ? 2 : topicById(Q.cur.tid).coins, gain = first ? base : Math.ceil(base / 2);
  record(Q.cur.tid, first);
  Q.streak = first ? Q.streak + 1 : 0;
  const s = slotEl(); if (s && Q.cur.kind === 'num') s.classList.add('good');
  $('#qcard').classList.add('good');
  SND.ok();
  addCoins(gain, s || $('#qcard'));
  Q.earned += gain;
  const fb = $('#feedback'); fb.className = 'feedback good'; fb.textContent = P(PRAISE) + (first ? '' : ' (בניסיון השני)');
  if (Q.streak > 0 && Q.streak % 5 === 0 && !Q.speed) {
    setTimeout(() => { addCoins(5, $('.qhead')); Q.earned += 5; toast(`🔥 רצף של ${Q.streak}! בונוס +5 מטבעות`); confetti(30); }, 350);
  }
  updateHead(); save();
  const cur = Q.cur;
  setTimeout(() => { if ($('#sc-quiz').classList.contains('active') && Q.cur === cur && !Q.ended) nextQ(); }, Q.speed ? 450 : 1050);
}
function onWrong(maxTries = 2) {
  Q.tries++; SND.bad();
  const fb = $('#feedback'), q = Q.cur, s = slotEl();
  $('#qcard').classList.remove('badc'); void $('#qcard').offsetWidth; $('#qcard').classList.add('badc');
  if (Q.speed) {
    Q.locked = true; record(q.tid, false); Q.streak = 0;
    if (s) { s.textContent = q.ans; s.classList.add('reveal'); }
    fb.className = 'feedback bad'; fb.textContent = 'אופס!';
    updateHead();
    const cur = Q.cur;
    setTimeout(() => { if (Q.cur === cur && !Q.ended) nextQ(); }, 900);
    return;
  }
  if (Q.tries < maxTries) {
    Q.input = ''; drawSlot();
    if (s) { s.classList.remove('bad'); void s.offsetWidth; s.classList.add('bad'); }
    fb.className = 'feedback bad'; fb.innerHTML = 'כמעט! נסו שוב 💪' + (q.tip ? `<span class="tip">💡 ${q.tip}</span>` : '');
    return;
  }
  // reveal
  Q.locked = true; Q.waiting = true; Q.streak = 0; record(q.tid, false);
  let ansTxt;
  if (q.kind === 'num') { if (s) { s.textContent = q.ans; s.classList.remove('bad'); s.classList.add('reveal'); } ansTxt = F(q.ans); }
  else { const b = $$('#answerArea .choice')[q.correct]; b.classList.add('reveal'); ansTxt = q.choices[q.correct]; }
  fb.className = 'feedback bad';
  fb.innerHTML = `התשובה הנכונה: <span dir="ltr">${ansTxt}</span>` + (q.tip ? `<span class="tip">💡 ${q.tip}</span>` : '');
  $('#answerArea').insertAdjacentHTML('afterbegin', `<button class="btn big gold" id="contBtn" style="width:100%;margin-bottom:10px">הבנתי, ממשיכים ←</button>`);
  $('#contBtn').onclick = () => { Q.waiting = false; nextQ(); };
  updateHead(); save();
}
function endSpeed() {
  clearInterval(Q.timer); Q.timer = null; Q.ended = true; Q.locked = true;
  const score = Q.correct, rec = score > (S.best || 0);
  let bonus = 0;
  if (rec && score > 0) { S.best = score; bonus = 10; addCoins(10); }
  save(); SND.fanfare(); if (rec && score > 0) confetti(70);
  modal(`<div class="big-emoji">${rec && score > 0 ? '🏆' : '⏱️'}</div><h2>${rec && score > 0 ? 'שיא חדש!' : 'הזמן נגמר!'}</h2>
    <p style="font-size:1.2rem"><b>${score}</b> תשובות נכונות מתוך ${Q.total}</p>
    <p>הרווחתם <b>${Q.earned + bonus}</b> 🪙${bonus ? ' (כולל בונוס שיא +10)' : ''}</p>
    <p class="muted">השיא שלך: ${S.best || 0}</p>
    <button class="btn big primary" id="again">עוד פעם! 🔁</button><button class="btn" id="toHome">לדף הבית</button>`);
  $('#again').onclick = () => { closeModal(); startQuiz('speed'); };
  $('#toHome').onclick = () => { closeModal(); go('home'); };
}
$('#quitQuiz').onclick = () => {
  SND.tap();
  if (Q && Q.timer) { clearInterval(Q.timer); Q.timer = null; }
  if (Q) Q.ended = true;
  const msg = Q && Q.total ? `פתרת ${Q.total} תרגילים והרווחת ${Q.earned} מטבעות! 🌟` : '';
  go('topics');
  if (msg) toast(msg, 2800);
};
document.addEventListener('keydown', e => {
  if (!$('#sc-quiz').classList.contains('active') || !Q || !$('#modal').classList.contains('hidden')) return;
  if (/^[0-9]$/.test(e.key)) keyPress(e.key);
  else if (e.key === 'Backspace') keyPress('del');
  else if (e.key === 'Enter') { if (Q.waiting) { Q.waiting = false; nextQ(); } else if (Q.cur.kind === 'num') keyPress('ok'); }
});

/* ---------- shop ---------- */
let shopSec = 'hair', preview = null;
function lookNow() { return preview ? { ...S.look, [preview.cat]: preview.id } : S.look; }
function openShop() { preview = null; renderShop(); show('shop'); }
function renderShop() {
  $('#shopStage').innerHTML = avatarSVG(lookNow());
  $('#tabs').innerHTML = SECTIONS.map(s => `<button class="tab ${s.id === shopSec ? 'on' : ''}" data-s="${s.id}">${s.name}</button>`).join('');
  $$('#tabs .tab').forEach(b => b.onclick = () => { shopSec = b.dataset.s; preview = null; SND.tap(); renderShop(); });
  const sec = SECTIONS.find(s => s.id === shopSec);
  $('#shopBody').innerHTML = sec.cats.map(cat => {
    const c = CAT[cat];
    return `<h3 class="cat-h">${c.label}</h3><div class="grid">` + c.items.map(it => {
      const own = isOwned(cat, it.id), on = S.look[cat] === it.id, pv = preview && preview.cat === cat && preview.id === it.id;
      let vis;
      if (c.type === 'color') vis = it.id === 'none' ? '<div class="sw none">🚫</div>' : `<div class="sw" style="background:${it.css || it.color}"></div>`;
      else vis = avatarSVG({ ...S.look, [cat]: it.id }, c.zoom || 'full');
      const price = own ? `<span class="pr own">${on ? '✓ עליי' : 'שלי'}</span>` : `<span class="pr">${it.price} 🪙</span>`;
      return `<button class="tile ${on ? 'on' : ''} ${own ? '' : 'locked'} ${pv ? 'pv' : ''} ${!own && it.price > S.coins ? 'cant' : ''}" data-c="${cat}" data-i="${it.id}">${vis}<span class="tn">${it.name}</span>${price}</button>`;
    }).join('') + '</div>';
  }).join('');
  $$('#shopBody .tile').forEach(b => b.onclick = () => tapItem(b.dataset.c, b.dataset.i));
  renderPv();
}
function tapItem(cat, id) {
  if (isOwned(cat, id)) { S.look[cat] = id; preview = null; save(); SND.tap(); }
  else { preview = { cat, id }; SND.tap(); }
  renderShop();
}
function renderPv() {
  const bar = $('#pvbar');
  if (!preview) { bar.hidden = true; return; }
  const it = item(preview.cat, preview.id), can = S.coins >= it.price;
  bar.hidden = false;
  bar.innerHTML = `<div class="info">${it.name} · ${it.price} 🪙<small>${can ? 'תצוגה מקדימה – רוצים לקנות?' : `חסרים עוד ${it.price - S.coins} מטבעות – בואו נפתור תרגילים!`}</small></div>` +
    (can ? `<button class="btn green" id="buyBtn">קנייה!</button>` : `<button class="btn primary" id="earnBtn">✏️ לתרגל</button>`) +
    `<button class="btn" id="pvX">✕</button>`;
  if (can) $('#buyBtn').onclick = buy;
  else $('#earnBtn').onclick = () => { preview = null; go('topics'); };
  $('#pvX').onclick = () => { preview = null; renderShop(); };
}
function buy() {
  const { cat, id } = preview, it = item(cat, id);
  if (S.coins < it.price) return;
  S.coins -= it.price; S.owned.push(cat + ':' + id); S.look[cat] = id; preview = null; save();
  SND.buy(); confetti(); setCoins(true);
  toast(`יש! ${it.name} עכשיו שלך 🎉`);
  renderShop();
}
$('#shopBack').onclick = () => { SND.tap(); preview = null; go('home'); };

/* ---------- stats & settings ---------- */
function showStats() {
  const rows = TOPICS.map(t => { const s = S.stats[t.id] || { c: 0, t: 0 }, pc = s.t ? Math.round(100 * s.c / s.t) : 0;
    return `<div class="stat"><span class="nm">${t.icon} ${t.name}</span><span class="bar"><div style="width:${pc}%"></div></span><span class="vl">${s.t ? pc + '% · ' + s.t : '—'}</span></div>`; }).join('');
  const total = Object.values(S.stats).reduce((a, s) => a + s.t, 0);
  const bought = S.owned.length, all = Object.values(CAT).reduce((a, c) => a + c.items.filter(i => i.price > 0).length, 0);
  modal(`<h2>📊 ההתקדמות שלי</h2>
    <p>פתרת <b>${total}</b> תרגילים · הרווחת <b>${F(S.earnedTotal || 0)}</b> 🪙</p>
    <p>שיא באתגר 60 שניות: <b>${S.best || 0}</b> · פריטים שנקנו: <b>${bought}/${all}</b></p>
    <p class="muted">אחוז ההצלחה בניסיון הראשון בכל נושא:</p>
    ${rows}
    <button class="btn primary" onclick="closeModal()">סגירה</button>`);
}
function showSettings() {
  modal(`<h2>⚙️ הגדרות</h2>
    <label class="field">שם הדמות<input id="setName" maxlength="14" value="${esc(S.name)}"></label>
    <div class="toggle"><span>🔊 צלילים</span><button class="btn" id="sndBtn">${S.sound ? 'פועלים' : 'כבויים'}</button></div>
    <button class="btn" id="rePick">🔄 החלפת דמות (הפריטים שקניתם נשמרים)</button>
    <button class="btn" id="resetAll" style="color:var(--bad)">🗑️ איפוס כל המשחק</button>
    <p class="muted">ההתקדמות נשמרת בדפדפן במכשיר הזה.</p>
    <button class="btn primary" id="setDone">שמירה</button>`);
  $('#sndBtn').onclick = () => { S.sound = !S.sound; save(); $('#sndBtn').textContent = S.sound ? 'פועלים' : 'כבויים'; SND.tap(); };
  $('#rePick').onclick = () => { closeModal(); $('#nameInput').value = S.name; renderPick(); show('pick'); };
  $('#resetAll').onclick = () => {
    if (confirm('בטוח? כל המטבעות, הפריטים וההתקדמות יימחקו.')) { S = freshState(); save(); closeModal(); $('#nameInput').value = ''; pickIdx = 0; renderPick(); show('pick'); }
  };
  $('#setDone').onclick = () => { const v = $('#setName').value.trim(); if (v) S.name = v.slice(0, 14); save(); closeModal(); renderHome(); };
}

/* =========================================================
   boot
   ========================================================= */
globalDefs();
if (!S.created) { renderPick(); show('pick'); }
else {
  go('home');
  if (S.lastDay !== today()) { S.lastDay = today(); save(); setTimeout(() => { addCoins(10); toast('☀️ בונוס יומי! +10 מטבעות'); }, 500); }
}
</script>
</body>
